[package]
name = "png-spark"
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
description = "A fast, zero-dependency PNG encoder and decoder supporting every colour type and bit depth."
repository = "https://github.com/stephenberry/png-spark"
keywords = ["png", "image", "deflate", "inflate", "encoding"]
categories = ["multimedia::images", "compression"]
exclude = ["bench/", "fuzz/", ".github/"]

[dependencies]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1

[workspace]
members = [".", "bench"]
